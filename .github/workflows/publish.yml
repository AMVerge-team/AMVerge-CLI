name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: validate version
        run: |
          TAG=${{ github.ref_name }}
          TAG_VER="${TAG#v}"

          TOML_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VER=$(python -c "exec(open('amverge/__version__.py').read()); print(__version__)")

          echo "tag    = $TAG (version $TAG_VER)"
          echo "toml   = $TOML_VER"
          echo "init   = $INIT_VER"

          fail=0
          if [ "$TAG_VER" != "$TOML_VER" ]; then
            echo "ERROR: tag version ($TAG_VER) != pyproject.toml version ($TOML_VER)"
            fail=1
          fi
          if [ "$TAG_VER" != "$INIT_VER" ]; then
            echo "ERROR: tag version ($TAG_VER) != __version__.py version ($INIT_VER)"
            fail=1
          fi
          exit $fail

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
